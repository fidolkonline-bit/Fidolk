name: Encrypted database backup

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create encrypted backup
        run: npm run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - name: Verify encrypted archive
        run: |
          encrypted_backup="$(find backups -name '*.dump.enc' -type f -print -quit)"
          npx tsx scripts/decrypt-backup.ts "$encrypted_backup" /tmp/fido-recovery.dump
          pg_restore --list /tmp/fido-recovery.dump > /dev/null
          rm /tmp/fido-recovery.dump
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - name: Retain encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: fido-backup-${{ github.run_id }}
          path: backups/*.dump.enc
          if-no-files-found: error
          retention-days: 30
